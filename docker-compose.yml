services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexo_erp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6432}:5432"
    volumes:
      - nexo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexo_dev} -d ${POSTGRES_DB:-nexo_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexo_postgres: