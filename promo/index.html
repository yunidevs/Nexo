<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"tagline","type":"string","label":"Tagline","default":"Tu operación, ordenada."},{"id":"outroLine1","type":"string","label":"Cierre línea 1","default":"Todo tu negocio,"},{"id":"outroLine2","type":"string","label":"Cierre línea 2","default":"en un solo panel."}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        /* Tokens del proyecto nexo-erp (apps/frontend/app/globals.css, tema oscuro) */
        --ground: #090a0d;
        --surface: #0d0f14;
        --raised: #111318;
        --ink: #f1f5f9;
        --ink-soft: #e2e8f0;
        --muted: #94a3b8;
        --faint: #748297;
        --dim: #475569;
        --dimmer: #727c8a;
        --line: rgba(255, 255, 255, 0.08);
        --line-soft: rgba(255, 255, 255, 0.07);
        --grid-soft: rgba(255, 255, 255, 0.05);
        --accent: #6366f1;
        --accent-soft: #818cf8;
        --accent-text: #a5b4fc;
        --accent-pale: #c7d2fe;
        --emerald: #34d399;
        --amber: #fcd34d;
        --rose: #fb7185;
        --font-display: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display), sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        class="clip"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="dashboard"
        class="clip"
        data-composition-id="dashboard"
        data-composition-src="compositions/dashboard.html"
        data-start="2.6"
        data-duration="5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        class="clip"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="7.6"
        data-duration="2.4"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
